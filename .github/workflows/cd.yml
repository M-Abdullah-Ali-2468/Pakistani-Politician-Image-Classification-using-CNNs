name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        shell: bash
        run: |
          OWNER_LOWER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER_LOWER}/pakistani-politician-classifier" >> "$GITHUB_OUTPUT"

      - name: Ensure model exists (DVC/Dagshub)
        shell: bash
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -f deployment/model/trained_model.pth ]; then
            echo "Model already present in repository."
            exit 0
          fi

          python -m pip install --upgrade pip
          python -m pip install "dvc[http]>=3,<4"

          # Dynamically grab the name of your DVC remote (usually 'origin' or 'dagshub')
          DVC_REMOTE_NAME="$(dvc remote list | awk '{print $1}' | head -n 1)"
          
          echo "Configuring authentication for DVC remote: ${DVC_REMOTE_NAME}"

          # Apply credentials to the active remote
          if [ -n "${DAGSHUB_USER}" ] && [ -n "${DAGSHUB_TOKEN}" ] && [ -n "${DVC_REMOTE_NAME}" ]; then
            dvc remote modify --local "${DVC_REMOTE_NAME}" auth basic
            dvc remote modify --local "${DVC_REMOTE_NAME}" user "${DAGSHUB_USER}"
            dvc remote modify --local "${DVC_REMOTE_NAME}" password "${DAGSHUB_TOKEN}"
          fi

          # Pull the model directly
          dvc pull deployment/model/trained_model.pth

          # Final verification
          if [ ! -f deployment/model/trained_model.pth ]; then
            echo "deployment/model/trained_model.pth not found. DVC pull failed."
            exit 1
          fi
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./deployment
          file: ./deployment/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
